services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: fieldops
      POSTGRES_USER: fieldops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"   # local only — not reachable outside the Pi
    # Same reasoning as cloudflared's own logging block below -- this
    # service has no daemon-level default cap (confirmed: no
    # /etc/docker/daemon.json on this Pi), so a `restart: unless-stopped`
    # container with no bound here means genuinely unbounded json-file
    # growth over a long-running production lifetime. Found and fixed
    # during a security/availability audit; applied to all three services
    # below that were missing it.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgres://fieldops:${POSTGRES_PASSWORD}@postgres:5432/fieldops
      AGENT_SERVICE_TOKEN: ${AGENT_SERVICE_TOKEN}
    volumes:
      - uploads:/app/uploads
    ports:
      - "127.0.0.1:3000:3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8080:80"   # local only, same pattern as backend — external access via cloudflared
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # OpenClaw is NOT a service here. Confirmed by actually installing it: it's
  # a CLI tool (curl install script / npm global package) that runs as its
  # own native systemd service on the host, not a Docker container — see
  # DEPLOYMENT.md for the real install/run steps.

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # TEMPORARY: Quick Tunnel mode (no domain registered yet) -- prints a
    # random *.trycloudflare.com URL to `docker compose logs cloudflared`
    # on every start; the URL changes on every restart, and there's no
    # login/access control on it. Once a real domain exists, switch back:
    # command: tunnel --no-autoupdate run
    # environment: [TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}]
    # ...and add a public hostname in the Cloudflare Zero Trust dashboard
    # instead of relying on the printed URL. See DEPLOYMENT.md.
    #
    # --protocol http2 (undocumented flag, confirmed working -- not listed in
    # `cloudflared tunnel --help` but accepted) forces TCP/HTTP2 instead of
    # the QUIC/UDP default. Confirmed via cloudflared logs this tunnel was
    # dropping every ~8-13 min with "timeout: no recent network activity" on
    # the QUIC connection -- classic symptom of a home router's UDP NAT table
    # timing out an idle connection. A live side-by-side test on this host
    # showed QUIC failing the "Cloudflare API" connectivity pre-check while
    # HTTP2 passed all pre-checks cleanly and registered without a retry.
    # Doesn't fix the underlying "no domain yet" tradeoff (URL still rotates
    # on restart) -- only the periodic drops within a single run.
    command: tunnel --no-autoupdate --protocol http2 --url http://frontend:80
    # Originally the only service with a logging cap -- added when this was
    # also getting polled every 5 minutes (openclaw/notifier/sync-dashboard-url.mjs)
    # on a `restart: unless-stopped` service with no daemon-level default.
    # The other three services above had the identical unbounded-growth
    # exposure and just hadn't hit it yet -- same fix applied to all of them
    # during a later audit, see postgres' comment above.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
  uploads:
