services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: fieldops
      POSTGRES_USER: fieldops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"   # local only — not reachable outside the Pi
    # Same reasoning as cloudflared's own logging block below -- this
    # service has no daemon-level default cap (confirmed: no
    # /etc/docker/daemon.json on this Pi), so a `restart: unless-stopped`
    # container with no bound here means genuinely unbounded json-file
    # growth over a long-running production lifetime. Found and fixed
    # during a security/availability audit; applied to all three services
    # below that were missing it.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgres://fieldops:${POSTGRES_PASSWORD}@postgres:5432/fieldops
      AGENT_SERVICE_TOKEN: ${AGENT_SERVICE_TOKEN}
    volumes:
      - uploads:/app/uploads
    ports:
      - "127.0.0.1:3000:3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8080:80"   # local only, same pattern as backend — external access via cloudflared
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # OpenClaw is NOT a service here. Confirmed by actually installing it: it's
  # a CLI tool (curl install script / npm global package) that runs as its
  # own native systemd service on the host, not a Docker container — see
  # DEPLOYMENT.md for the real install/run steps.

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # Named tunnel, real domain (sodboysltd.org) -- replaces the earlier
    # Quick Tunnel mode (random *.trycloudflare.com URL, rotated on every
    # restart, no login/access control). Ingress (which hostname maps to
    # which local service) is configured cloud-side via the tunnel's Public
    # Hostname settings in the Cloudflare Zero Trust dashboard, not here --
    # this container just authenticates and connects using the token.
    #
    # --protocol http2 kept from the Quick Tunnel config -- confirmed live
    # this host's QUIC/UDP connections were dropping every ~8-13 min
    # ("timeout: no recent network activity", a home router's UDP NAT table
    # timing out an idle connection); HTTP2 doesn't have that failure mode.
    # Applies the same regardless of quick vs. named tunnel mode.
    command: tunnel --no-autoupdate --protocol http2 run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    # Originally the only service with a logging cap -- added when this was
    # also getting polled every 5 minutes (openclaw/notifier/sync-dashboard-url.mjs)
    # on a `restart: unless-stopped` service with no daemon-level default.
    # The other three services above had the identical unbounded-growth
    # exposure and just hadn't hit it yet -- same fix applied to all of them
    # during a later audit, see postgres' comment above.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
  uploads:
