services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: fieldops
      POSTGRES_USER: fieldops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"   # local only — not reachable outside the Pi

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgres://fieldops:${POSTGRES_PASSWORD}@postgres:5432/fieldops
      AGENT_SERVICE_TOKEN: ${AGENT_SERVICE_TOKEN}
    volumes:
      - uploads:/app/uploads
    ports:
      - "127.0.0.1:3000:3000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8080:80"   # local only, same pattern as backend — external access via cloudflared

  # OpenClaw is NOT a service here. Confirmed by actually installing it: it's
  # a CLI tool (curl install script / npm global package) that runs as its
  # own native systemd service on the host, not a Docker container — see
  # DEPLOYMENT.md for the real install/run steps.

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # TEMPORARY: Quick Tunnel mode (no domain registered yet) -- prints a
    # random *.trycloudflare.com URL to `docker compose logs cloudflared`
    # on every start; the URL changes on every restart, and there's no
    # login/access control on it. Once a real domain exists, switch back:
    # command: tunnel --no-autoupdate run
    # environment: [TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}]
    # ...and add a public hostname in the Cloudflare Zero Trust dashboard
    # instead of relying on the printed URL. See DEPLOYMENT.md.
    command: tunnel --no-autoupdate --url http://frontend:80

volumes:
  pgdata:
  uploads:
