server {
  listen 80;
  root /usr/share/nginx/html;

  # Found missing during a security audit. Tailored to what this app
  # actually loads, confirmed by reading the source rather than guessing:
  # - img-src needs the OSM tile subdomains (MapPage.tsx's only external
  #   resource; everything else, including Leaflet's own CSS/marker icons,
  #   is bundled and served same-origin).
  # - style-src needs 'unsafe-inline' -- every page in this dashboard uses
  #   React's style={{...}} prop extensively, which compiles to inline
  #   style="..." attributes CSP would otherwise block. A real trade-off,
  #   not an oversight: rewriting the app's styling approach to avoid it
  #   was out of scope for a header fix.
  # - script-src is 'self' only -- no inline <script> or CDN scripts
  #   anywhere in this build, confirmed by grepping the source.
  # - connect-src 'self' covers the API calls, which are same-origin via
  #   the /api/ proxy below, never cross-origin.
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://*.tile.openstreetmap.org; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location /api/ {
    proxy_pass http://backend:3000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location / {
    try_files $uri /index.html;
  }
}
